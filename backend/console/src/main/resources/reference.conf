logging4s {
  console {
    # error | warn | info | debug | trace
    level = "info"
    level = ${?LOGGING4S_CONSOLE_LEVEL}

    # per-logger thresholds, matched by exact name or dot-segment prefix, most specific wins
    # levels { "io.netty" = "warn" }
    levels {}

    # json | plain
    format = "json"
    format = ${?LOGGING4S_CONSOLE_FORMAT}

    # auto (colored only on a TTY) | on | off
    color = "auto"
    color = ${?LOGGING4S_CONSOLE_COLOR}

    # stdout | stderr
    stream = "stdout"
    stream = ${?LOGGING4S_CONSOLE_STREAM}

    # -1 keeps the full stack trace
    max-stack-trace-lines = -1
    max-stack-trace-lines = ${?LOGGING4S_CONSOLE_MAX_STACK_TRACE_LINES}
  }
}
